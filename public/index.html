<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Vlog Queue</title>
    <meta name="description" content="Upload B-roll, pick a type and format, and get finished videos back from Vlog Boy." />
    <meta name="theme-color" content="#f9f2dc" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Vlog Queue" />
    <link rel="manifest" href="manifest.json" />
    <link rel="apple-touch-icon" href="apple-touch-icon.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Ultra&family=Chivo:wght@400;500;700&display=swap" rel="stylesheet" />
    <style id="expo-reset">
      #root { display: block; min-height: 100%; }
    </style>
  </head>
  <body>
    <noscript>Vlog Queue needs JavaScript to talk to your bucket.</noscript>
    <div id="root"></div>
    <script>
      if ("serviceWorker" in navigator && location.hostname !== "localhost") {
        window.addEventListener("load", function () { navigator.serviceWorker.register("sw.js"); });
      }
    </script>
  </body>
</html>
